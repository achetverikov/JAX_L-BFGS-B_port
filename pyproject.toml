[build-system]
requires=["setuptools>=77","wheel"]
build-backend="setuptools.build_meta"
[project]
name="jax-lbfgsb"
version="0.1.0"
description="JAX-native batched L-BFGS-B"
requires-python=">=3.11"
dependencies=["jax>=0.4.35","numpy>=1.26"]
[project.optional-dependencies]
test=["pytest>=8","scipy>=1.13"]
[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-ra"
